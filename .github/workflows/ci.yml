name: 支付接口自动化 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 后台启动 mock 支付服务
        run: |
          cd mock_server
          python app.py > ../server.log 2>&1 &
          echo $! > ../server.pid

      - name: 等待服务就绪（健康检查）
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5000/health | grep -q '"status":"up"'; then
              echo "服务就绪，等待 ${i} 秒"
              exit 0
            fi
            sleep 1
          done
          echo "服务启动超时，日志如下："
          cat server.log
          exit 1

      - name: 运行接口自动化测试
        run: |
          python -m pytest tests/ -v \
            --junitxml=junit.xml \
            --html=report.html --self-contained-html \
            --alluredir=allure-results

      - name: 质量门禁
        run: python scripts/check_gate.py

      - name: 生成 Allure 报告
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          allure_report: allure-report

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            report.html
            junit.xml
            allure-results/
            allure-report/
            server.log
          retention-days: 14

      - name: 关闭 mock 服务
        if: always()
        run: kill $(cat server.pid) 2>/dev/null || true
